<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout('Formulario de Gasto', ~{::div})}">
<body>
    <div>
        <form th:action="@{/gastos/guardar}" th:object="${gasto}" method="POST" class="standard-form">
            <input type="hidden" th:field="*{idGasto}" />
            
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" th:field="*{fecha}" required>
                <div class="error-text" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="valorTotalSinIVA">Valor Total sin IVA</label>
                    <input type="number" step="0.01" id="valorTotalSinIVA" th:field="*{valorTotalSinIVA}" required>
                    <div class="error-text" th:if="${#fields.hasErrors('valorTotalSinIVA')}" th:errors="*{valorTotalSinIVA}"></div>
                </div>
                
                <div class="form-group" style="flex: 1;">
                    <label for="porcentajeIva">Porcentaje de IVA (%)</label>
                    <input type="number" step="0.1" id="porcentajeIva" name="porcentajeIva" value="19" required>
                    <small>Ej: 19 para 19%</small>
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="ivaTotal">IVA Total (Calculado)</label>
                    <input type="number" step="0.01" id="ivaTotal" th:field="*{ivaTotal}" readonly style="background-color: #334155; cursor: not-allowed;">
                </div>
                
                <div class="form-group" style="flex: 1;">
                    <label for="valorTotalConIVA">Valor Total con IVA</label>
                    <input type="number" step="0.01" id="valorTotalConIVA" th:field="*{valorTotalConIVA}" readonly style="background-color: #334155; cursor: not-allowed; font-weight: bold; color: #10b981;">
                </div>
            </div>
            
            <div class="form-group">
                <label for="lugar">Lugar</label>
                <input type="text" id="lugar" th:field="*{lugar}" required maxlength="150">
                <div class="error-text" th:if="${#fields.hasErrors('lugar')}" th:errors="*{lugar}"></div>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>Usuario Responsable</label>
                <input type="text" readonly th:value="${session.usuarioLogueado.id + ' (' + session.usuarioLogueado.nombre + ')'}" style="background-color: #334155; cursor: not-allowed;">
                <small>El gasto se asignará a tu cuenta automáticamente</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar Gasto</button>
                <a th:href="@{/gastos}" class="btn-secondary">Cancelar</a>
            </div>
        </form>

        <script>
            // Cálculo dinámico del total con IVA
            const inputSinIva = document.getElementById('valorTotalSinIVA');
            const inputPorcentaje = document.getElementById('porcentajeIva');
            const inputIvaTotal = document.getElementById('ivaTotal');
            const inputTotalConIva = document.getElementById('valorTotalConIVA');

            function calcularTotal() {
                const sinIva = parseFloat(inputSinIva.value) || 0;
                const porcentaje = parseFloat(inputPorcentaje.value) || 0;
                
                const iva = sinIva * (porcentaje / 100);
                const total = sinIva + iva;
                
                inputIvaTotal.value = iva.toFixed(2);
                inputTotalConIva.value = total.toFixed(2);
            }

            inputSinIva.addEventListener('input', calcularTotal);
            inputPorcentaje.addEventListener('input', calcularTotal);
            
            // Initial calc
            calcularTotal();
        </script>
    </div>
</body>
</html>
