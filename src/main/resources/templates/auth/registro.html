<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Gastos</title>
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <h2>Registro de Usuario</h2>
        
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        <div th:if="${exito}" class="success-msg" th:text="${exito}"></div>
        
        <form th:action="@{/registro}" method="POST" th:object="${usuario}">
            <div class="form-group">
                <label for="id">ID de Usuario</label>
                <input type="text" id="id" th:field="*{id}" required>
            </div>
            
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" th:field="*{clave}" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Registrarse</button>
            </div>
            
            <div class="form-links">
                <a th:href="@{/}">Volver al Inicio de Sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
