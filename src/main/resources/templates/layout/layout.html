<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Gestión de Gastos</title>
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <!-- Banner for Spring Boot Version -->
    <div style="background-color: #10b981; color: white; text-align: center; padding: 10px; font-weight: bold; font-size: 1.1em; letter-spacing: 1px;">
        🚀 APP GASTOS - VERSIÓN SPRING BOOT MVC EN RENDER 🚀
    </div>
    <!-- Top Navigation from old repository -->
    <nav th:if="${session.usuarioLogueado != null}">
        <a th:href="@{/gastos}">App Gastos</a>
        
        <div>
            <a th:href="@{/acerca-de}">Acerca de</a>
            <a th:href="@{/usuarios}">Gestión Usuarios</a>
            <a th:href="@{/gastos}">Gestión Gastos</a>
            <a th:href="@{/gastos/reportes}">Reportes</a>
            
            <th:block th:if="${session.usuarioLogueado.rol == 'Administrador'}">
                <a th:href="@{/smtp}">Config. SMTP</a>
            </th:block>
        </div>
        
        <div>
            <span>Hola, <strong th:text="${session.usuarioLogueado.nombre}">Usuario</strong></span>
            <a th:href="@{/logout}">Cerrar Sesión</a>
        </div>
    </nav>
    <nav th:if="${session.usuarioLogueado == null}">
        <a th:href="@{/login}">App Gastos</a>
        <div>
            <a th:href="@{/acerca-de}">Acerca de</a>
        </div>
        <div>
            <a th:href="@{/login}">Iniciar Sesión</a>
            <a th:href="@{/registro}">Registrarse</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1100px;">
        <div th:if="${exito}" class="success-msg" style="background-color: rgba(34, 197, 94, 0.1); border: 1px solid var(--success-color); color: #86efac; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; text-align: center;" th:text="${exito}"></div>
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        
        <!-- Main Body injected here -->
        <div th:replace="${content}"></div>
    </div>
</body>
</html>
