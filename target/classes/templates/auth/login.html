<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gastos</title>
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <h2>Ingreso al Sistema</h2>
        
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        <div th:if="${exito}" class="success-msg" th:text="${exito}"></div>
        
        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="id">ID de Usuario</label>
                <input type="text" id="id" name="id" required>
            </div>
            <div class="form-group">
                <label for="clave">Clave</label>
                <input type="password" id="clave" name="clave" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </div>
            <div class="form-links">
                <!-- Por simplicidad en la migracion, el admin crea los usuarios, pero dejamos el link comentado -->
                <!-- <a th:href="@{/usuarios/nuevo}">Registrar Usuario</a> -->
                <a th:href="@{/recuperar}">¿Olvidó su clave?</a>
            </div>
        </form>
    </div>
</body>
</html>
